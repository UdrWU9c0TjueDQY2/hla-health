<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Left in the bottle is not the amount you drank</title><desc id="desc">Starting with750mL and no refills or spills: one quarter remaining is187.5mL left and562.5mL consumed; one half remaining is375mL left and375mL consumed; three quarters remaining is562.5mL left and187.5mL consumed. Fractions describe volume, not bottle height.</desc><rect width="1080" height="1350" fill="#eef4f5"/><g font-family="Arial,sans-serif" fill="#143f52"><text x="72" y="100" font-size="23" letter-spacing="3">HONEST LITTLE APPS / BOTTLE MATH</text><text x="72" y="205" font-size="64" font-weight="700">What’s left isn’t</text><text x="72" y="282" font-size="64" font-weight="700">what you drank.</text><text x="72" y="350" font-size="29">Start with 750 mL. No refills, spills or sharing.</text>
<rect x="60" y="407" width="960" height="202" rx="20" fill="white"/><text x="86" y="460" font-size="32" font-weight="700">¼ remaining</text><rect x="86" y="490" width="85" height="60" rx="6" fill="#167a9a"/><rect x="185" y="490" width="85" height="60" rx="6" fill="#e1e9eb"/><rect x="284" y="490" width="85" height="60" rx="6" fill="#e1e9eb"/><rect x="383" y="490" width="85" height="60" rx="6" fill="#e1e9eb"/><text x="86" y="585" font-size="25">187.5 mL left</text><text x="550" y="506" font-size="49" font-weight="700">562.5 mL</text><text x="550" y="552" font-size="27">consumed</text><rect x="60" y="637" width="960" height="202" rx="20" fill="white"/><text x="86" y="690" font-size="32" font-weight="700">½ remaining</text><rect x="86" y="720" width="85" height="60" rx="6" fill="#167a9a"/><rect x="185" y="720" width="85" height="60" rx="6" fill="#167a9a"/><rect x="284" y="720" width="85" height="60" rx="6" fill="#e1e9eb"/><rect x="383" y="720" width="85" height="60" rx="6" fill="#e1e9eb"/><text x="86" y="815" font-size="25">375 mL left</text><text x="550" y="736" font-size="49" font-weight="700">375 mL</text><text x="550" y="782" font-size="27">consumed</text><rect x="60" y="867" width="960" height="202" rx="20" fill="white"/><text x="86" y="920" font-size="32" font-weight="700">¾ remaining</text><rect x="86" y="950" width="85" height="60" rx="6" fill="#167a9a"/><rect x="185" y="950" width="85" height="60" rx="6" fill="#167a9a"/><rect x="284" y="950" width="85" height="60" rx="6" fill="#167a9a"/><rect x="383" y="950" width="85" height="60" rx="6" fill="#e1e9eb"/><text x="86" y="1045" font-size="25">562.5 mL left</text><text x="550" y="966" font-size="49" font-weight="700">187.5 mL</text><text x="550" y="1012" font-size="27">consumed</text>
<text x="72" y="1140" font-size="28" font-weight="700">Consumed = starting volume − remaining volume</text><text x="72" y="1194" font-size="24">Use measured volume, not the height of an uneven bottle.</text><text x="72" y="1232" font-size="24">This is volume arithmetic, not a daily drinking goal.</text><text x="72" y="1301" font-size="24" font-weight="700">Dropkin browser companion · Honest Little Apps</text></g></svg>